<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>공지사항 | 소통쉼터</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo-link"
        >
            <img
                src="images/community-hub-on.png"
                alt="Community Hub ON"
                class="header-brand-logo"
            >

            <strong>
                소통쉼터
            </strong>
        </a>


        <div class="header-region">

            <span class="header-region-dot"></span>

            <span>
                공주
            </span>

        </div>


        <nav class="main-nav">

            <a href="index.html#about">
                쉼터 소개
            </a>

            <a href="index.html#service">
                서비스 안내
            </a>

            <a href="support.html">
                주민지원사업
            </a>

            <a
                href="notice.html"
                class="active"
            >
                공지사항
            </a>

            <a href="index.html#related">
                관련사이트
            </a>

        </nav>

    </div>

</header>



<!-- =========================
     NOTICE DETAIL
========================= -->

<main class="notice-detail-page">

    <div class="notice-detail-head">

        <p class="notice-page-eyebrow">
            NOTICE
        </p>

        <h1>
            <a href="notice.html">
                공지사항
            </a>
        </h1>

    </div>


    <article class="notice-detail">

        <div class="notice-detail-title-area">

            <span
                class="notice-detail-category"
                id="noticeDetailCategory"
            >
                공지
            </span>

            <h2 id="noticeDetailTitle">
                공지사항 제목
            </h2>

            <span
                class="notice-detail-date"
                id="noticeDetailDate"
            >
                2026.08.20
            </span>

        </div>


        <div
            class="notice-detail-content"
            id="noticeDetailContent"
        >
            공지사항 내용이 표시됩니다.
        </div>


        <!-- 첨부파일 -->
        <div
            class="notice-detail-file"
            id="noticeDetailFile"
        >

            <div class="notice-detail-file-label">
                첨부파일
            </div>

            <a
                href="#"
                id="noticeDetailFileLink"
                target="_blank"
                rel="noopener noreferrer"
            >
                첨부파일.pdf
            </a>

            <span>
                ↗
            </span>

        </div>


        <div class="notice-detail-bottom">

            <a
                href="notice.html"
                class="notice-list-button"
            >
                목록으로
            </a>

        </div>

    </article>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-inner">

        <div class="footer-left">

            <h2>
                소통쉼터
            </h2>

            <p>
                주민과 가까이에서 소통하고,
                지역과 함께 더 나은 내일을 만들어갑니다.
            </p>

        </div>

        <div class="footer-right">

            <div class="footer-menu">

                <a href="index.html#about">
                    쉼터 소개
                </a>

                <a href="index.html#service">
                    서비스 안내
                </a>

                <a href="notice.html">
                    공지사항
                </a>

                <a href="index.html#related">
                    관련사이트
                </a>

            </div>

            <p class="footer-copy">
                © 2026 소통쉼터. All rights reserved.
            </p>

        </div>

    </div>

</footer>


<script src="notice-detail.js"></script>

</body>

</html>
